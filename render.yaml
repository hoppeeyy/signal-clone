services:
  - type: web
    name: signal-clone-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: data/uploads
      - key: PUBLIC_API_URL
        sync: false
      - key: ENV
        value: production
